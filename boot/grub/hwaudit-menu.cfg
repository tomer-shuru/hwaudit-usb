### Hardware audit - SystemRescue 13.02. Consumes no Blancco licenses. ###
# Collects specs, SMART and diagnostics to \specs\ on this stick.
# The collector is \autorun at the root of this stick. It is found via
# ar_source=/dev/disk/by-label/BLANCCO, which points SystemRescue at this
# partition's root directory. A readable copy lives in \hwaudit\collect.sh.
submenu "Hardware audit - specs + SMART, no license used" {
	menuentry "Collect hardware report to USB [auto]" --id=hwaudit {
		set isofile="/images/systemrescue-13.02-amd64.iso"
		loopback srcd $isofile
		set root=(srcd)
		linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd iomem=relaxed ar_source=/dev/disk/by-label/BLANCCO ar_ignorefail copytoram earlymodules=loop img_dev=/dev/disk/by-label/BLANCCO img_loop=$isofile
		initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
	}

	menuentry "Collect hardware report to USB [low RAM, no copytoram]" --id=hwaudit_lowram {
		set isofile="/images/systemrescue-13.02-amd64.iso"
		loopback srcd $isofile
		set root=(srcd)
		linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd iomem=relaxed ar_source=/dev/disk/by-label/BLANCCO ar_ignorefail earlymodules=loop img_dev=/dev/disk/by-label/BLANCCO img_loop=$isofile
		initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
	}

	# nomodeset means X only ever gets the framebuffer the firmware set up, so
	# ask for the panel's own mode rather than the menu's 1024x768 - otherwise
	# the screen test runs scaled (an 840 G11 came up 1024x768 on a 1920x1080
	# panel). Only set here: on the KMS entries the kernel picks the mode, and
	# gfxpayload=keep can itself cause a black panel.
	menuentry "Collect hardware report to USB [basic display]" --id=hwaudit_nomodeset {
		set isofile="/images/systemrescue-13.02-amd64.iso"
		loopback srcd $isofile
		set root=(srcd)
		set gfxmode=auto
		set gfxpayload=keep
		linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd iomem=relaxed ar_source=/dev/disk/by-label/BLANCCO ar_ignorefail copytoram nomodeset earlymodules=loop img_dev=/dev/disk/by-label/BLANCCO img_loop=$isofile
		initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
	}

	# Fallback: plain shell, autorun disabled. If the automatic entries above do
	# not run the collector, boot this and run it by hand:
	#   mkdir -p /mnt/usb && mount /dev/disk/by-label/BLANCCO /mnt/usb && bash /mnt/usb/autorun
	menuentry "SystemRescue shell only (manual / troubleshooting)" --id=hwaudit_shell {
		set isofile="/images/systemrescue-13.02-amd64.iso"
		loopback srcd $isofile
		set root=(srcd)
		linux /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd iomem=relaxed ar_disable copytoram earlymodules=loop img_dev=/dev/disk/by-label/BLANCCO img_loop=$isofile
		initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
	}

}

